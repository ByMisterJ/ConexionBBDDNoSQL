# DynamoDB Configuration
# For local development with DynamoDB Local, uncomment the following line:
# dynamodb.endpoint=http://localhost:8000

# AWS Region
aws.region=us-east-1

# AWS Credentials (for local testing - do NOT commit real credentials)
# Alternatively, set these as environment variables:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_SESSION_TOKEN (optional)
# - DYNAMODB_ENDPOINT (for local mode)

# For local development, you can use dummy credentials with DynamoDB Local
# aws.access.key.id=dummy
# aws.secret.access.key=dummy
